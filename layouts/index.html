{{ define "main" }}
  <h2 class="section-title">Posts</h2>
  <ul class="post-list">
    {{ range where .Site.RegularPages "Section" "posts" }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
      </li>
    {{ end }}
  </ul>
{{ end }}
